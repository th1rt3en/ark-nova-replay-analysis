<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game over - Ark Nova</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/endstats.css">
<style>
  body { max-width: 50rem; margin: 2rem auto; }
  .facts { color: var(--muted); font-size: .9rem; text-align: center; }
  .actions { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin: 1.2rem 0; }
  .actions a { padding: .55rem .9rem; border: 1px solid var(--accent); border-radius: 6px; text-decoration: none; }
  .actions a.primary { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div id="msg" class="loading" role="status">Loading the result…</div>
<main id="end" hidden>
  <div id="endstats" class="endstats" style="display:block"></div>
  <div class="facts" id="facts"></div>
  <div class="actions" id="actions"></div>
</main>
<script src="/js/endstats.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const game = new URLSearchParams(location.search).get('game') || '';
  if (!/^E\d+$/.test(game)) { location.replace('/play.html'); return; }
  // the table is exported a moment after the last move: ask again for a few seconds
  let data = null, lastStatus = 0;
  for (let i = 0; i < 20 && !data; i++) {
    const r = await fetch('/api/games/' + game + '/result').catch(() => null);
    lastStatus = r ? r.status : 0;
    if (r && r.ok) { data = await r.json(); if ((data.status === 'finished' || data.status === 'conceded') && !data.stats && i < 10) { data = null; await new Promise((ok) => setTimeout(ok, 1000)); } }
    else if (r && r.status === 404 && i >= 3) break;
    else await new Promise((ok) => setTimeout(ok, 1000));
  }
  const msg = $('msg');
  if (!data) {
    msg.className = 'error';
    msg.textContent = lastStatus === 404 ? 'No such game.' : 'The result is not available yet. Reload the page in a moment.';
    return;
  }
  msg.hidden = true;
  $('end').hidden = false;
  const res = data.result || {};
  document.title = 'Game ' + game + ' over - Ark Nova';
  EndStats.render($('endstats'), { names: [0, 1].map((i) => data.names[i] || 'Seat ' + (i + 1)), scores: res.scores || [], winner: res.winner, conceded: res.conceded,
                                   status: data.status, stats: data.stats && data.stats.players });
  const bits = ['Game ' + game];
  if (data.marine_worlds) bits.push('Marine Worlds');
  if (data.n_actions) bits.push(data.n_actions + ' moves');
  $('facts').textContent = bits.join(' · ');
  const link = (text, href, cls) => { const a = document.createElement('a'); a.href = href; a.textContent = text; if (cls) a.className = cls; $('actions').append(a); };
  if (data.replayable) link('Watch the replay', '/replay.html?table=' + game, 'primary');
  link('New game', '/play.html', data.replayable ? '' : 'primary');
  link('Start page', '/');
})();
</script>
</body>
</html>
