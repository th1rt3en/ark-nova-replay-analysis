<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<title>Game over - Ark Nova Park</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/endstats.css">
<link rel="stylesheet" href="/css/lobbies.css">
<link rel="stylesheet" href="/css/park-fonts.css">
<link rel="stylesheet" href="/css/poster-page.css">
<link rel="stylesheet" href="/css/poster-content.css">
</head>
<body class="poster narrow">
<p class="small"><a href="/">&larr; Ark Nova Park</a></p>
<div id="msg" class="loading" role="status">Loading the result…</div>
<main id="end" class="pp" hidden>
  <div id="endstats" class="endstats" style="display:block"></div>
  <div class="facts" id="facts"></div>
  <section class="ratings" id="ratings" hidden></section>
  <div class="actions" id="actions"></div>
</main>
<script src="/js/endstats.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const game = new URLSearchParams(location.search).get('game') || '';
  if (!/^E\d+$/.test(game)) { location.replace('/play.html'); return; }
  // the table is exported a moment after the last move: ask again for a few seconds
  let data = null, lastStatus = 0;
  for (let i = 0; i < 20 && !data; i++) {
    const r = await fetch('/api/games/' + game + '/result').catch(() => null);
    lastStatus = r ? r.status : 0;
    if (r && r.ok) { data = await r.json(); if ((data.status === 'finished' || data.status === 'conceded') && !data.stats && i < 10) { data = null; await new Promise((ok) => setTimeout(ok, 1000)); } }
    else if (r && r.status === 404 && i >= 3) break;
    else await new Promise((ok) => setTimeout(ok, 1000));
  }
  const msg = $('msg');
  if (!data) {
    msg.className = 'error';
    msg.textContent = lastStatus === 404 ? 'No such game.' : 'The result is not available yet. Reload the page in a moment.';
    return;
  }
  if (data.status === 'waiting' || data.status === 'playing') {                        // (not over: this page has no result to show)
    msg.className = 'error';
    msg.textContent = 'This game is not over yet.';
    const a = document.createElement('a'); a.href = '/play.html?game=' + game; a.textContent = ' Go to the game';
    msg.append(a);
    return;
  }
  msg.hidden = true;
  $('end').hidden = false;
  const res = data.result || {};
  document.title = 'Game ' + game + ' over - Ark Nova Park';
  EndStats.render($('endstats'), { names: [0, 1].map((i) => data.names[i] || 'Seat ' + (i + 1)), scores: res.scores || [], winner: res.winner, conceded: res.conceded, reason: res.reason || (/overtime/.test(data.end_reason || '') ? 'overtime' : undefined),
                                   status: data.status, stats: data.stats && data.stats.players });
  const bits = ['Game ' + game];
  if (data.marine_worlds) bits.push('Marine Worlds');
  if (data.n_actions) bits.push(data.n_actions + ' moves');
  $('facts').textContent = bits.join(' · ');
  if (data.rated) {                                                                     // a rated game: what it did to the ratings
    const box = $('ratings');
    box.hidden = false;
    const h = document.createElement('h2'); h.textContent = 'Rated game'; box.append(h);
    if (data.ratings && data.ratings.length) {
      const t = document.createElement('table');
      for (const r of data.ratings) {
        const tr = document.createElement('tr');
        const who = document.createElement('td'); const a = document.createElement('a'); a.href = '/profile.html?id=' + encodeURIComponent(r.account_id); a.textContent = r.name; who.append(a);
        const change = document.createElement('td'); change.textContent = r.before + ' \u2192 ' + r.after;
        const d = document.createElement('td'); d.textContent = (r.delta > 0 ? '+' : '') + r.delta; d.className = r.delta > 0 ? 'up' : r.delta < 0 ? 'down' : '';
        tr.append(who, change, d); t.append(tr);
      }
      box.append(t);
    } else {
      const p = document.createElement('p'); p.textContent = 'This game did not change any rating: it ended before enough turns were played, or the ratings are still being written (reload in a moment).'; box.append(p);
    }
  }
  const link = (text, href, primary) => { const a = document.createElement('a'); a.href = href; a.textContent = text; a.className = 'btnlink' + (primary ? '' : ' plain'); $('actions').append(a); };
  if (data.replayable) link('Watch the replay', '/replay.html?table=' + game, true);
  link('New game', '/play.html', !data.replayable);
  link('Start page', '/');
})();
</script>
<script type="module" src="/js/notify.js"></script>
</body>
</html>
