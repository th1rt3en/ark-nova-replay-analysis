<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox - Ark Nova</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/replay.css">
</head>
<body class="viewer forkpage sandboxpage">
<section id="lobby" class="lobby" hidden>
  <h1>Sandbox</h1>
  <p class="muted">Play against a bot that only passes, on a board you set up and can edit at any time.</p>
  <form id="lobbyform">
    <label class="lobbyrow"><input type="checkbox" id="mw"> Marine Worlds</label>
    <label class="lobbyrow">Map of seat 1 <select id="map0"></select></label>
    <label class="lobbyrow">Map of seat 2 <select id="map1"></select></label>
    <fieldset class="lobbyrow">
      <legend>You play</legend>
      <label><input type="radio" name="seat" value="0" checked> seat 1</label>
      <label><input type="radio" name="seat" value="1"> seat 2</label>
    </fieldset>
    <button type="submit" id="start">Start the sandbox</button>
    <div id="lobbymsg" role="status" class="muted"></div>
  </form>
  <p><a href="/">Back to the start page</a></p>
</section>
<div id="loading" class="status loading" role="status" hidden>Loading the sandbox…</div>
<div id="app" hidden>
  <header class="bar">
    <a href="/" class="home" title="Back to the start page">Ark Nova Sandbox</a>
    <span id="tableInfo" class="muted"></span>
    <div id="pov" class="pov" role="group" aria-label="Point of view"></div>
    <div id="timeline" class="timeline" role="slider" aria-label="Game timeline" title="Timeline: each | is the start of a round"></div>
    <div class="controls" role="group" aria-label="Replay controls">
      <button id="first" title="First step (Home)" aria-label="First step">&#9198;</button>
      <button id="prev" title="Back one step (Left arrow)" aria-label="Back one step">&#9194;&#xFE0E;</button>
      <button id="play" title="Start / stop autoplay (Space)" aria-label="Start autoplay">&#9654;</button>
      <button id="next" title="Forward one step (Right arrow)" aria-label="Forward one step">&#9193;&#xFE0E;</button>
      <button id="last" title="Last step (End)" aria-label="Last step">&#9197;</button>
      <label class="jump">Step <input id="jump" type="number" min="0" aria-label="Jump to step"> / <span id="total"></span></label>
      <span class="speed" role="group" aria-label="Autoplay speed">
        <button data-speed="1" class="on" title="Autoplay at 1x (one step a second)">1x</button>
        <button data-speed="2" title="Autoplay at 2x">2x</button>
        <button data-speed="4" title="Autoplay at 4x">4x</button>
      </span>
    </div>
  </header>
  <div id="current" class="current" aria-live="polite"></div>
  <div id="forkinfo" class="forkinfo" hidden></div>
  <div class="layout">
    <main>
      <div id="actionbar" class="actionbar" hidden></div>
      <details id="sbtools" class="sbtools" open></details>
      <section id="forkpanel" class="forkpanel" aria-label="Legal moves"></section>
      <section id="shared" class="shared"></section>
      <section id="zoos" class="zoos"></section>
    </main>
    <aside>
      <section id="side" class="side"></section>
      <h2>Moves</h2>
      <ol id="moves" class="moves"></ol>
    </aside>
  </div>
</div>
<img id="preview" class="preview" alt="" hidden>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  if (params.get('play') === '1' && sessionStorage.getItem('sandboxGame')) {
    window.FORK_MODE = true; window.SANDBOX_MODE = true;
    $('loading').hidden = false;
    const s = document.createElement('script'); s.src = '/js/replay.js'; document.body.append(s);
    return;
  }
  $('lobby').hidden = false;
  const fill = async () => {
    const res = await fetch('/api/sandbox/maps?marine_worlds=' + ($('mw').checked ? 'true' : 'false'));
    const maps = (await res.json()).maps;
    for (const id of ['map0', 'map1']) {
      const sel = $(id), keep = sel.value;
      sel.replaceChildren(...maps.map((m) => { const o = document.createElement('option'); o.value = m.id; o.textContent = 'Map ' + m.id + ': ' + m.name; return o; }));
      if (maps.some((m) => m.id === keep)) sel.value = keep;
    }
  };
  $('mw').onchange = fill;
  fill();
  $('lobbyform').onsubmit = async (e) => {
    e.preventDefault();
    $('start').disabled = true; $('lobbymsg').textContent = 'Starting…';
    try {
      const res = await fetch('/api/sandbox/new', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ marine_worlds: $('mw').checked, maps: [$('map0').value, $('map1').value], controller: +document.querySelector('input[name=seat]:checked').value }) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.message || 'could not start');
      sessionStorage.setItem('sandboxGame', JSON.stringify(body));
      location.href = '/sandbox.html?play=1';
    } catch (err) { $('lobbymsg').textContent = err.message; $('start').disabled = false; }
  };
})();
</script>
</body>
</html>
