<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ark Nova Replay</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Ark Nova Replay</h1>
<p class="muted">Step through a finished 2-player Ark Nova game and fork it at any point to play out an alternative line.</p>
<form id="f">
  <input type="text" id="q" placeholder="Table id or table url" autocomplete="off" autofocus required
         aria-label="BGA table id or url">
  <button id="go">Open</button>
</form>
<p class="muted">Paste a BGA table id (<code>924000095</code>) or a table url
  (<code>https://boardgamearena.com/table?table=924000095</code>).</p>
<div id="msg" role="status" hidden></div>
<script>
const msg = document.getElementById('msg');
function show(text, kind) { msg.textContent = text; msg.className = kind; msg.hidden = false; }
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true; show('Checking the table…', 'loading');
  try {
    const res = await fetch('/api/lookup?q=' + encodeURIComponent(document.getElementById('q').value));
    const body = await res.json();
    if (body.status === 'ready') { show('Table found, opening the replay…', 'loading'); location.href = body.next; }
    else if (body.status === 'needs_log') {
      show('This table is indexed but its log has not been collected. Taking you to the log submission page…', 'ok');
      setTimeout(() => { location.href = body.next; }, 1200);
    } else { show(body.message || 'Something went wrong.', 'error'); }
  } catch (err) { show('Could not reach the server, try again.', 'error'); }
  finally { go.disabled = false; }
});
</script>
</body>
</html>
