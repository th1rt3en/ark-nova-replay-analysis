<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<title>Importing a log - Ark Nova Park</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/lobbies.css">
<link rel="stylesheet" href="/css/park-fonts.css">
<link rel="stylesheet" href="/css/poster-page.css">
<link rel="stylesheet" href="/css/poster-content.css">
</head>
<body class="poster slim">
<p class="small"><a href="/">&larr; Ark Nova Park</a></p>
<main class="pp">
<h1>Importing the game log</h1>
<div id="msg" role="status" class="loading">Waiting for the log from the browser extension…</div>
</main>
<script src="/js/logstore.js"></script>
<script>
// The browser extension (extension/) opens this page from a BGA review page and posts the captured log to it. When it opens the page without a click
// (?ark=auto: the base projects were collected in the background) there is no opener: the extension's script on this page posts the message to the page itself.
const table = new URLSearchParams(location.search).get('table');
const msg = document.getElementById('msg');
function show(text, kind, errors) {
  msg.textContent = text;
  if (errors && errors.length) {
    const ul = document.createElement('ul'); ul.className = 'errors';
    for (const e of errors) { const li = document.createElement('li'); li.textContent = e; ul.appendChild(li); }
    msg.appendChild(ul);
  }
  msg.className = kind;
}
const auto = new URLSearchParams(location.search).get('ark') === 'auto';
if (!/^\d+$/.test(table || '') || !(window.opener || auto)) {
  show('Open this page with the extension button on a BGA game review page.', 'error');
} else {
  let started = false;                                      // (the extension may post the message more than once)
  window.addEventListener('message', async (e) => {
    const d = e.data;
    if (started || (auto ? e.origin !== location.origin : e.source !== window.opener) || !d || d.type !== 'ark-nova-log' || d.table !== table || typeof d.log !== 'string') return;
    // the table info the extension collected (optional): it must be about the same table as the log
    const index = d.index && typeof d.index === 'object' ? d.index : null;
    if (index && String(index.id) !== table) { show('The table info is about another table (' + index.id + ').', 'error'); return; }
    started = true;
    show('Opening the replay…', 'loading');
    try {
      // (no round trip to the server here: the replay page sends the log, which the server verifies first and answers with the reason when it cannot be used)
      await LogStore.put(table, d.log);
      await LogStore.put('index:' + table, index ? JSON.stringify(index) : '');     // (kept with the log: the replay and the fork read the players' Elo from it; none when the review page was opened directly)
      // the base projects the extension read off BGA's replay, when the log never shows all three (3 keys like "P103", in the order of the board); else nothing stays from an earlier import
      const projects = Array.isArray(d.base_projects) && d.base_projects.length === 3 && d.base_projects.every((k) => /^P\d{3}$/.test(k)) ? d.base_projects : null;
      await LogStore.put('baseprojects:' + table, projects ? JSON.stringify(projects) : '');
      // the maps of the players when BGA masks them in the table info (no BGA premium): {player id: "9"}, read off BGA's replay by the extension; else nothing stays from an earlier import
      const maps = d.maps && typeof d.maps === 'object' && !Array.isArray(d.maps) && Object.keys(d.maps).length && Object.entries(d.maps).every(([p, m]) => /^\d+$/.test(p) && typeof m === 'string' && /^[0-9A-Za-z]{1,3}$/.test(m)) ? d.maps : null;
      await LogStore.put('maps:' + table, maps ? JSON.stringify(maps) : '');
      location.replace('/replay.html?table=' + table + '&source=upload');
    } catch (err) { show('Could not keep the log in this browser, try again.', 'error'); }
  });
  if (window.opener) window.opener.postMessage({ type: 'ark-nova-import-ready' }, '*');
  if (auto) setTimeout(() => {
    if (started) return;
    show('The extension has not sent the log. Go back to the BGA game review page and click "Open in Ark Nova Replay" again. If nothing happens, allow the extension to access this site (browser add-on settings, Permissions).', 'error');
  }, 8000);
}
</script>
</body>
</html>
