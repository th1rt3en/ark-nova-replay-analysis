<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player - Ark Nova Park</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/lobbies.css">
<link rel="stylesheet" href="/css/park-fonts.css">
<link rel="stylesheet" href="/css/poster-page.css">
<link rel="stylesheet" href="/css/poster-content.css">
</head>
<body class="poster narrow">
<p class="small"><a href="/">&larr; Ark Nova Park</a> &middot; <a href="/ratings.html">Ratings</a></p>
<div id="msg" class="muted">Loading…</div>
<main id="player" class="pp" hidden>
  <h1 id="name"></h1>
  <p class="muted" id="sub"></p>
  <div class="stats" id="stats"></div>
  <section id="tablesbox" hidden>
    <h2>Your tables</h2>
    <div id="tables"></div>
  </section>
  <section>
    <h2>Last rated games</h2>
    <div id="histbox"></div>
  </section>
  <section class="danger" id="danger" hidden>
    <h2>Delete this account</h2>
    <p class="muted small">Your name, password and sessions are removed and the account becomes "Deleted player". Your rated games and their rating changes stay. This cannot be undone.</p>
    <form id="delform"><input type="password" id="delpw" placeholder="Your password" autocomplete="current-password" required aria-label="Your password"><button class="danger">Delete my account</button></form>
    <p id="delmsg" class="muted small" role="alert"></p>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id') || '';
const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
async function main() {
  const me = await fetch('/api/auth/me').then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const wanted = id || (me && me.account && me.account.id) || '';
  if (!wanted) { $('msg').textContent = me && me.enabled ? 'Log in to see your profile, or open a player from the ratings page.' : 'Profiles are not available here.'; return; }
  const res = await fetch('/api/players/' + encodeURIComponent(wanted));
  if (!res.ok) { $('msg').textContent = 'No such player.'; return; }
  const p = await res.json();
  $('msg').hidden = true; $('player').hidden = false;
  document.title = p.username + ' - Ark Nova Park';
  $('name').textContent = p.username;
  $('sub').textContent = `Player ${p.id} · member since ${p.member_since}` + (p.seeded_from_bga ? ' · starting rating copied from Board Game Arena (not verified)' : '');
  const stat = (v, l) => { const d = mk('div', 'stat'); d.append(mk('b', typeof v === 'number' ? null : 'word', String(v)), mk('span', null, l)); return d; };
  $('stats').append(stat(p.rating, 'Rating'), stat(p.rated_games, 'Rated games'), stat(p.rated_wins, 'Wins'), stat(p.listed ? 'Yes' : 'After 5 rated games', 'On the ratings board'));
  if (!p.history.length) $('histbox').append(mk('p', 'muted', 'No rated games yet.'));
  else {
    const t = mk('table', 'hist'); t.innerHTML = '<tr><th>Game</th><th>Against</th><th>Result</th><th>Rating</th></tr>';
    for (const h of p.history) {
      const tr = mk('tr');
      const g = mk('td'); const a = mk('a', null, h.game_id); a.href = '/replay.html?table=' + encodeURIComponent(h.game_id); g.append(a);
      const o = mk('td'); const oa = mk('a', null, h.opponent); oa.href = '/profile.html?id=' + encodeURIComponent(h.opponent_id); o.append(oa);
      const r = mk('td', null, h.result === 1 ? 'Win' : h.result === 0 ? 'Loss' : 'Draw');
      const d = mk('td', h.delta > 0 ? 'up' : h.delta < 0 ? 'down' : '', `${h.before} → ${h.after} (${h.delta > 0 ? '+' : ''}${h.delta})`);
      tr.append(g, o, r, d); t.append(tr);
    }
    $('histbox').append(t);
  }
  if (me && me.account && me.account.id === p.id) {                               // your own profile: every table you have a seat at (the way back without the link), then the way to delete the account
    const tr = await fetch('/api/me/games', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    if (tr) {
      $('tablesbox').hidden = false;
      if (!tr.games.length) $('tables').append(mk('p', 'muted', 'No tables yet. Games you start from a lobby or play as a rated game are listed here.'));
      else {
        const t = mk('table', 'hist'); t.innerHTML = '<tr><th>Table</th><th>Against</th><th>Kind</th><th>Status</th><th></th></tr>';
        for (const g of tr.games) {
          const row = mk('tr');
          const id = mk('td', null, g.game_id);
          const o = mk('td'); if (g.opponent_id) { const oa = mk('a', null, g.opponent); oa.href = '/profile.html?id=' + encodeURIComponent(g.opponent_id); o.append(oa); } else o.textContent = g.opponent;
          const status = g.status === 'live' ? 'In progress' : g.status === 'finished' || g.status === 'conceded' ? (g.result === 'win' ? 'Won' : g.result === 'loss' ? 'Lost' : g.result === 'draw' ? 'Draw' : 'Ended') : 'Abandoned';
          const links = mk('td');
          for (const [href, text] of [[g.play_url, 'Back to the table'], [g.end_url, 'Result'], [g.replay_url, 'Replay']]) if (href) { const a = mk('a', null, text); a.href = href; links.append(a, document.createTextNode(' ')); }
          row.append(id, o, mk('td', null, g.rated ? 'Rated' : 'Friendly'), mk('td', null, status), links); t.append(row);
        }
        $('tables').append(t);
      }
    }
    $('danger').hidden = false;
    $('delform').onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch('/api/auth/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('delpw').value }) });
      if (r.ok) { location.href = '/'; return; }
      $('delmsg').textContent = (await r.json().catch(() => ({}))).message || 'The account could not be deleted.';
    };
  }
}
main();
</script>
<script type="module" src="/js/account.js"></script>
<script type="module" src="/js/notify.js"></script>
</body>
</html>
