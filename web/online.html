<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Online now</title>
<style>
  :root { --bg: #1b1f1a; --card: #262c24; --ink: #e8e6d8; --dim: #9aa38f; --accent: #8fc46a; --line: #38402f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .big { font-size: 56px; font-weight: 700; line-height: 1; color: var(--accent); }
  .dim { color: var(--dim); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 14px; }
  .row div b { display: block; font-size: 22px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ranges { display: flex; gap: 4px; }
  .ranges button { padding: 4px 10px; background: var(--bg); color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  .ranges button.on { background: var(--accent); color: #12200a; border-color: var(--accent); }
  .chart { position: relative; margin-top: 10px; }
  .chart svg { width: 100%; height: auto; display: block; touch-action: none; }
  .chart text { fill: var(--dim); font-size: 11px; }
  .tip { position: absolute; top: 0; pointer-events: none; background: #11140f; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.5; white-space: nowrap; transform: translateX(-50%); }
  .tip b { font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #12200a; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: #e8907a; }
  .axis { display: flex; justify-content: space-between; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Online now</h1>
  <div class="card" id="login" hidden>
    <p class="dim">Admin secret (the service's <code>INTERNAL_SECRET</code>). It stays in this tab only.</p>
    <form id="form"><input id="secret" type="password" autocomplete="off" placeholder="Admin secret"><button>Show</button></form>
    <p class="err" id="loginerr"></p>
  </div>
  <div id="view" hidden>
    <div class="card">
      <div class="big" id="now">–</div>
      <div class="dim" id="window"></div>
      <div class="row" id="pages"></div>
    </div>
    <div class="card">
      <div class="head">
        <span><b>People online over time</b> <span class="dim" id="peak"></span></span>
        <span class="ranges" id="ranges"></span>
      </div>
      <div class="chart" id="chart"></div>
      <div class="legend" id="legend"></div>
      <p class="dim" id="chartnote"></p>
    </div>
    <p class="dim" id="status"></p>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'ark:admin-secret';
  let timer = null;
  const get = () => { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const put = (v) => { try { sessionStorage.setItem(KEY, v); } catch (e) { /* kept for this page view only */ } };

  const PAGES = [['replay', '#8fc46a'], ['fork', '#e0b252'], ['play', '#6aa9c4'], ['sandbox', '#b58fd0'], ['other', '#8a8f84']];
  const RANGES = [[6, '6 h'], [24, '24 h'], [72, '3 days'], [336, '14 days']];
  let hours = 24, last = null;
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; };
  const fmt = (t, withDay) => new Date(t).toLocaleString([], withDay ? { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' } : { hour: '2-digit', minute: '2-digit' });

  // the timeline: stacked by page type; a time with no sample is a time when nobody was there (the Worker stops sampling then), so it is drawn as zero
  function timeline(d) {
    const step = d.step_ms, end = d.now, start = Math.floor((end - hours * 3600e3) / step) * step;
    const by = new Map(d.samples.map((s) => [s.at, s]));
    const pts = [];
    for (let t = start; t <= end; t += step) { const s = by.get(t); pts.push({ t, ...Object.fromEntries(PAGES.map(([k]) => [k, s ? s[k] : 0])), users: s ? s.users : 0 }); }
    pts.push({ t: end, ...Object.fromEntries(PAGES.map(([k]) => [k, d.by_page[k] || 0])), users: d.online });         // (the last point is the count now)
    const W = 720, H = 250, ml = 34, mr = 8, mt = 8, mb = 26, pw = W - ml - mr, ph = H - mt - mb;
    const top = Math.max(1, ...pts.map((p) => p.users)), niceTop = top <= 4 ? 4 : Math.ceil(top / 4) * 4;
    const x = (t) => ml + ((t - start) / (end - start || 1)) * pw, y = (v) => mt + ph - (v / niceTop) * ph;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'People online over time' });
    for (let i = 0; i <= 4; i += 1) {
      const v = (niceTop / 4) * i;
      svg.append(el('line', { x1: ml, x2: W - mr, y1: y(v), y2: y(v), stroke: '#38402f', 'stroke-width': 1 }), el('text', { x: ml - 6, y: y(v) + 4, 'text-anchor': 'end' }, String(Math.round(v))));
    }
    const ticks = 5;
    for (let i = 0; i <= ticks; i += 1) { const t = start + ((end - start) / ticks) * i; svg.append(el('text', { x: x(t), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === ticks ? 'end' : 'middle' }, fmt(t, hours > 24))); }
    let base = pts.map(() => 0);
    for (const [k, color] of PAGES) {
      const upper = pts.map((p, i) => base[i] + p[k]);
      if (upper.some((v, i) => v !== base[i])) {
        const d1 = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(upper[i]).toFixed(1)}`).join('');
        const d2 = pts.map((p, i) => `L${x(pts[pts.length - 1 - i].t).toFixed(1)},${y(base[pts.length - 1 - i]).toFixed(1)}`).join('');
        svg.append(el('path', { d: d1 + d2 + 'Z', fill: color, 'fill-opacity': .78, stroke: color, 'stroke-width': 1 }));
      }
      base = upper;
    }
    const cursor = el('line', { y1: mt, y2: mt + ph, stroke: '#e8e6d8', 'stroke-width': 1, 'stroke-dasharray': '3 3', visibility: 'hidden' });
    const hit = el('rect', { x: ml, y: mt, width: pw, height: ph, fill: 'transparent' });
    svg.append(cursor, hit);
    const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true;
    const move = (e) => {
      const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
      const t = start + ((px - ml) / pw) * (end - start);
      const p = pts.reduce((a, b) => (Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a));
      cursor.setAttribute('x1', x(p.t)); cursor.setAttribute('x2', x(p.t)); cursor.setAttribute('visibility', 'visible');
      tip.innerHTML = `<div class="dim">${fmt(p.t, true)}${hours > 48 ? ' (busiest sample of the hour)' : ''}</div><b>${p.users}</b> online` + PAGES.filter(([k]) => p[k]).map(([k, c]) => `<div><i style="display:inline-block;width:8px;height:8px;background:${c};border-radius:2px;margin-right:5px"></i>${k} ${p[k]}</div>`).join('');
      tip.hidden = false;
      const cw = $('chart').clientWidth, left = (x(p.t) / W) * cw;
      tip.style.left = Math.min(Math.max(left, 70), cw - 70) + 'px';
    };
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { tip.hidden = true; cursor.setAttribute('visibility', 'hidden'); });
    $('chart').replaceChildren(svg, tip);
    $('legend').replaceChildren(...PAGES.map(([k, c]) => { const s = document.createElement('span'); s.innerHTML = `<i style="background:${c}"></i>${k}`; return s; }));
    const busiest = pts.reduce((a, b) => (b.users > a.users ? b : a), pts[0]);
    $('chartnote').textContent = `Busiest in this range: ${busiest.users} at ${fmt(busiest.t, true)}. ` + (hours > 48 ? 'Each point is the busiest 5-minute sample of an hour.' : 'Each point is a 5-minute sample; flat zero means nobody was on the site.');
  }

  function draw(d) {
    last = d;
    $('now').textContent = d.online;
    $('window').textContent = 'people active on a replay, fork or play page in the last ' + Math.round(d.window_s / 60) + ' minutes (anonymous heartbeats)';
    $('pages').replaceChildren(...Object.entries(d.by_page).map(([k, n]) => { const div = document.createElement('div'); div.innerHTML = '<b>' + n + '</b><span class="dim">' + k + '</span>'; return div; }));
    $('peak').textContent = '· peak in the last 24 h: ' + d.peak_24h;
    timeline(d);
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · refreshes every 30 s while this tab is in focus';
  }

  function drawRanges() {
    $('ranges').replaceChildren(...RANGES.map(([h, label]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.className = h === hours ? 'on' : ''; b.addEventListener('click', () => { hours = h; drawRanges(); clearTimeout(timer); load(); }); return b; }));
  }

  async function load() {
    const secret = get();
    if (!secret) { $('login').hidden = false; $('view').hidden = true; return; }
    try {
      const res = await fetch('/api/admin/online?hours=' + hours, { headers: { 'X-Admin-Secret': secret }, cache: 'no-store' });
      if (res.status === 403) { put(''); $('loginerr').textContent = 'That is not the admin secret.'; $('login').hidden = false; $('view').hidden = true; return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      draw(await res.json());
      $('login').hidden = true; $('view').hidden = false;
    } catch (e) {
      $('view').hidden = false; $('status').textContent = 'Could not read the count (' + e.message + '). Trying again in 30 s.';
    }
    schedule();
  }

  // Poll only while the tab is on show and the window has focus (a forgotten tab kept a Cloud Run instance awake); coming back reloads at once.
  const active = () => document.visibilityState === 'visible' && document.hasFocus();
  function schedule() {
    clearTimeout(timer);
    timer = active() ? setTimeout(() => { timer = null; load(); }, 30000) : null;
  }
  function resume() { if (active() && !timer) load(); }
  document.addEventListener('visibilitychange', resume);
  window.addEventListener('focus', resume);
  window.addEventListener('blur', () => { clearTimeout(timer); timer = null; });

  $('form').addEventListener('submit', (e) => { e.preventDefault(); put($('secret').value.trim()); $('loginerr').textContent = ''; load(); });
  drawRanges();
  load();
})();
</script>
</body>
</html>
