<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" href="/brand/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<title>Fork - Ark Nova Replay</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/replay.css">
<link rel="stylesheet" href="/css/table.css">
<link rel="stylesheet" href="/css/parkposter.css">
</head>
<body class="viewer forkpage">
<div id="loading" class="status loading" role="status">Loading…</div>
<div id="app" hidden>
  <div class="layout">
    <main>
      <div class="movebar">
        <a class="brand" href="/" title="Ark Nova Replay: back to the start page" aria-label="Ark Nova Replay: back to the start page"><img src="/brand/logo.svg" width="60" height="60" alt=""></a>
        <div class="movepill">
          <div id="actionbar" class="actionbar" hidden></div>
          <div id="current" class="current" aria-live="polite"></div>
          <span id="enginemark" class="enginemark"></span>
        </div>
        <div id="hdrstats" class="hdrstats"></div>
      </div>
      <section id="forkpanel" class="forkpanel" aria-label="Legal moves"></section>
      <section id="shared" class="shared"></section>
      <section id="zoos" class="zoos"></section>
    </main>
    <aside class="sidebar">
      <div class="sbtabs" role="tablist">
        <button id="tabControl" class="sbtab on" type="button" role="tab" aria-selected="true">Control</button>
        <button id="tabLog" class="sbtab" type="button" role="tab" aria-selected="false">Log</button>
      </div>
      <div id="paneControl" class="sbpane">
      <header class="bar">
        <div class="controls" role="group" aria-label="Replay controls">
          <button id="first" title="First step (Home)" aria-label="First step"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h3v14H3zM17 3l-9 7 9 7z"/></svg></button>
          <button id="prev" title="Back one step (Left arrow)" aria-label="Back one step"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M17 3v14l-9-7zM8 3v14l-9-7z" transform="translate(2 0)"/></svg></button>
          <button id="play" title="Start / stop autoplay (Space)" aria-label="Start autoplay"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2l13 8-13 8z"/></svg></button>
          <button id="next" title="Forward one step (Right arrow)" aria-label="Forward one step"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3l9 7-9 7zM11 3l9 7-9 7z" transform="translate(-1 0)"/></svg></button>
          <button id="last" title="Last step (End)" aria-label="Last step"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 3h3v14h-3zM3 3l9 7-9 7z"/></svg></button>
        </div>
        <div id="timeline" class="timeline" role="slider" aria-label="Game timeline" title="Timeline: each | is the start of a round" hidden></div>
        <div id="tldeco" class="tldeco" aria-hidden="true"><i></i></div>
        <div class="controls controls2" role="group" aria-label="Settings, move and fork">
          <button id="settings" class="settingsbtn" title="Settings (S)" aria-label="Settings"><svg class="gearicon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10.29 3.57 L10.57 1.09 L13.43 1.09 L13.71 3.57 L16.75 4.83 L18.70 3.28 L20.72 5.30 L19.17 7.25 L20.43 10.29 L22.91 10.57 L22.91 13.43 L20.43 13.71 L19.17 16.75 L20.72 18.70 L18.70 20.72 L16.75 19.17 L13.71 20.43 L13.43 22.91 L10.57 22.91 L10.29 20.43 L7.25 19.17 L5.30 20.72 L3.28 18.70 L4.83 16.75 L3.57 13.71 L1.09 13.43 L1.09 10.57 L3.57 10.29 L4.83 7.25 L3.28 5.30 L5.30 3.28 L7.25 4.83Z M12 8.4a3.6 3.6 0 1 0 0 7.2a3.6 3.6 0 1 0 0-7.2Z"/></svg></button>
          <label class="jump">Move <input id="jump" type="number" min="0" aria-label="Jump to move"></label>
        </div>
      </header>
    <div id="forkinfo" class="forkinfo" hidden></div>
        <section id="side" class="side"></section>
      </div>
      <div id="paneLog" class="sbpane" hidden>
        <ol id="moves" class="moves"></ol>
      </div>
    </aside>
  </div>
</div>
<img id="preview" class="preview" alt="" hidden>
<script>window.FORK_MODE = true;</script>
<script src="/js/progress.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
