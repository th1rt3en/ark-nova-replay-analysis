[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-nova-replay"
version = "0.1.0"
description = "BGA Ark Nova replay viewer and forkable rules engine (base game + Marine Worlds)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.20", "google-cloud-storage>=2.16"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ark_nova = ["data/*.json", "minigames/manifest.json", "minigames/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
